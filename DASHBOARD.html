<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="DASHBOARD.css">
    <link rel = "stylesheet" href = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href = "https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel = "styleheet">

</head>
<body>
    <div class = "CONTAINER1">
        <div class = "LOGO">
            <i class = "fa-solid fa-calendar-days"></i>
        </div>
        <h1 class = "TITLE1"> Ayo </h1>
        <h1 class = "TITLE2"> Sched </h1>
        <div class = "PROFILE">
            <i class = "fa-solid fa-user"></i>
        </div>
        <h1 class = "GREETING"> Good Day, User! </h1>
    </div>
    <div class = "ADD">
        <h1 class = "ADD-TITLE"> Add New Schedule </h1>
        <h1 class = "ADD-TITLE1"> Subject Name </h1>
        <div class = "ADD-SUBJECT">
            <input type = "text" placeholder = "Enter Subject">
        </div>
        <h1 class = "ADD-TITLE2"> Instructor </h1>
        <div class = "ADD-INSTRUCTOR">
            <input type = "text" placeholder = "Enter Instructor Name">
        </div>
        <h1 class = "ADD-TITLE3"> Location </h1>
        <div class = "ADD-LOCATION">
            <input type = "text" placeholder = "Enter Location">
        </div>
        <h1 class = "ADD-TITLE4"> Day </h1>
        <div class = "ADD-DAY">
            <input type = "text" placeholder = "Monday">
        </div>
        <h1 class = "ADD-TITLE5"> Schedule Type </h1>
        <div class = "ADD-SCHEDULE-TYPE">
            <input type = "text" placeholder = "Lecture">
        </div>
        <h1 class = "ADD-TITLE6"> Start Time </h1>
        <div class = "ADD-START">
            <input type = "text" placeholder = "08:00 AM">
        </div>
        <h1 class = "ADD-TITLE7"> End Time </h1>
        <div class = "ADD-END">
            <input type = "text" placeholder = "09:00 AM">
        </div>
        <h1 class = "ADD-TITLE8"> Notes(Optional) </h1>
        <div class = "ADD-NOTES">
            <input type = "text" placeholder = "Additional Notes...">
        </div>
        <div class = "ADD-BUTTON">
            <form action = "">
                <button href = "#"> + Add Schedule </button>
            </form>
        </div>
        <div class = "CLEAR-BUTTON">
            <form action = "">
                <button href = "#"> + Clear </button>
            </form>
        </div>
    </div>
    <div class = "MAIN">
        <div class = "CALENDAR">
             <i class = "fa-solid fa-calendar-days"></i>
        </div>
        <h1 class = "Weekly"> Weekly Timetable </h1>
        <button class = "VIEW-CALENDAR"> View Calendar 
            <i class = "fa-solid fa-arrow-right"></i>
        </button>
        <div class = "LINE"></div>
        <button class = "MONDAY"> MONDAY </button>
        <button class = "TUESDAY"> TUESDAY </button>
        <button class = "WEDNESDAY"> WEDNESDAY </button>
        <button class = "THURSDAY"> THURSDAY </button>
        <button class = "FRIDAY"> FRIDAY </button>
        <button class = "SATURDAY"> SATURDAY </button>
        <button class = "SUNDAY"> SUNDAY </button>
        <div class = "EMPTY">
            <i class = "fa-regular fa-calendar-check"></i>
        </div>
        <h2 class = "NOTES"> No Classes Schedule Yet </h2>
        <p class = "NOTES1"> Add a schedule to see your weekly timetable here. </p>
    </div>
    <div class = "REMAIN-SUBJECT">
        <div class = "REMAIN-BOOK">
            <i class = "fa-solid fa-book"></i>
        </div>
        <h1 class = "REMAIN-NUMBER"> 8 </h1>
        <p class = "REMAIN-TEXT"> Total Subjects </p>
    </div>
    <div class = "CLASS-TODAY">
        <div class = "CLASS-BOOK">
            <i class = "fa-solid fa-calendar-check"></i>
        </div>
        <h1 class = "CLASS-NUMBER"> 4 </h1>
        <p class = "CLASS-TEXT"> Classes Today </p>
    </div>
    <div class = "NEXT-CLASS">
        <div class = "TIME-BOOK">
            <i class = "fa-solid fa-clock"></i>
        </div>
        <h1 class = "TIME-NUMBER"> 10:00 AM </h1>
        <p class = "TIME-TEXT"> Next Class </p>
    </div>
    <script src = "DASHBOARD.js"></script>
</body>
</html>
